name: Wiz IaC Pre-Deployment Scan (4.1.5)

on:
  pull_request:
    paths:
      - 'terraform/**'
  push:
    branches:
      - main
      - staging
    paths:
      - 'terraform/**'
  workflow_dispatch:

jobs:
  wiz-iac-pre-deploy:
    name: Wiz IaC Pre-Deployment Plan Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      WIZ_ENV: "demo"
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Configure 1Password Service Account
        uses: 1password/load-secrets-action/configure@dafbe7cb03502b260e2b2893c753c352eee545bf # ratchet:1password/load-secrets-action/configure@v3.2.1
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load Environment Secrets
        uses: 1password/load-secrets-action@dafbe7cb03502b260e2b2893c753c352eee545bf # ratchet:1password/load-secrets-action@v3.2.1
        with:
          export-env: true
        env:
          WIZ_CLIENT_ID: op://wiz-demo/tenant_stgadvanced-wizcli-sa/username
          WIZ_CLIENT_SECRET: op://wiz-demo/tenant_stgadvanced-wizcli-sa/password

      # 1. Setup Terraform and compile execution plan
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init & Plan
        run: |
          terraform init
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > plan.tfplanjson

      # 2. Download and prepare Wiz CLI
      - name: Download Wiz CLI
        run: |
          curl -Lo wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli

      # 3. 4.1.5 Core Requirement: Scan the compiled plan artifact
      - name: Run Wiz IaC Pre-Deployment Scan
        id: scan
        run: |
          ./wizcli iac scan \
            --path plan.tfplanjson \
            --policies "block-s3-cors-wildcard-build"
        continue-on-error: true

      # 4. Enforce pre-deployment gate (halts pipeline on policy violation)
      - name: Pre-Deployment Policy Gate
        if: steps.scan.outcome == 'failure'
        run: |
          echo "❌ Pre-Deployment Gate Failed: Resolved Terraform plan violates Wiz policy 'block-s3-cors-wildcard-build'."
          exit 1

      # 5. Apply only proceeds if the Wiz scan passes cleanly
      - name: Terraform Apply
        run: |
          echo "✅ Wiz Pre-Deployment gate passed. Proceeding with deployment."
