name: Wiz CI/CD IaC Scan

on:
  pull_request:
    paths:
      - 'terraform/**'
  workflow_dispatch:

jobs:
  wiz-iac-scan:
    name: Wiz CI/CD IaC Security Scan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write
    env:
      WIZ_ENV: "demo"
      WIF_PROVIDER: ${{ vars.GAR_STAGING_WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ vars.GAR_STAGING_SERVICE_ACCOUNT }}
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Load Environment Secrets from GCP Secret Manager
        run: |
          WIZ_SA_JSON=$(gcloud secrets versions access latest --secret="tenant_stgadvanced-wizcli-sa" --project=demosecrets)
          WIZ_CLIENT_ID=$(echo "$WIZ_SA_JSON" | jq -r '.username')
          WIZ_CLIENT_SECRET=$(echo "$WIZ_SA_JSON" | jq -r '.password')
          echo "::add-mask::$WIZ_CLIENT_ID"
          echo "::add-mask::$WIZ_CLIENT_SECRET"
          {
            echo "WIZ_CLIENT_ID=$WIZ_CLIENT_ID"
            echo "WIZ_CLIENT_SECRET=$WIZ_CLIENT_SECRET"
          } >> "$GITHUB_ENV"

      - name: Download Wiz CLI
        run: |
          curl -Lo wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli

      - name: Run Wiz IaC scan
        id: scan
        run: |
          ./wizcli iac scan \
            --path . \
            --policies "block-s3-cors-wildcard-build"
        continue-on-error: true

      - name: Fail on findings
        if: steps.scan.outcome == 'failure'
        run: |
          echo "❌ Wiz IaC scan found misconfigurations matching policy 'block-s3-cors-wildcard-build'."
          exit 1
