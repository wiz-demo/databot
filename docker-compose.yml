services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      # init.sql runs on first boot; it \copy's the CSV from /app/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  databot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:9103:80"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      # Chat requires a cloud LLM backend. GCP/Vertex is the default; for local
      # use, provide credentials (e.g. mount an ADC file) and set:
      #   AI_PROVIDER=vertex + GOOGLE_CLOUD_PROJECT=<project>
      #   AI_PROVIDER=bedrock + AWS creds/AWS_REGION
      AI_PROVIDER: ${AI_PROVIDER:-vertex}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
